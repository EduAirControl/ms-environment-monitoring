spring.application.name=ms-environment-monitoring

# Puerto canonico segun 09-microservices/service-catalog.md
server.port=${SERVER_PORT:3003}

# --- Persistencia ---
# ADR-003: una instancia PostgreSQL compartida y un esquema o namespace propio por
# servicio. El esquema es environment_monitoring y no se toca ningun otro dominio.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${DB_CHANGELOG_CONTEXTS:}

# --- Broker ---
# Consume dos topologias (ver mas abajo): sensor.installation.* y classroom.*.
# Las mediciones NO llegan por el broker: el unico camino de ingesta es
# POST /api/v1/measurements (MeasurementService), que tambien evalua umbrales.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# 4 reintentos con backoff exponencial (1s, 2s, 4s, 8s) y luego cola de letras
# muertas con 7 dias de retencion, segun 02-domain/domain-events.md.
app.messaging.max-retries=${MESSAGING_MAX_RETRIES:4}
app.messaging.initial-retry-interval-ms=${MESSAGING_INITIAL_RETRY_INTERVAL_MS:1000}
app.messaging.prefetch=${MESSAGING_PREFETCH:50}

# --- Seguridad: mismo JWT que el resto de servicios; el gateway tambien lo valida ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server.error.include-message=always

# --- Topologia de instalaciones ---
# El productor es el outbox de ms-sensor-management. Sin esta proyeccion las
# mediciones se guardan pero no se ven: las consultas hacen JOIN contra ella.
app.messaging.installations-exchange=${INSTALLATIONS_EXCHANGE:eduaircontrol.sensor}
app.messaging.installations-queue=${INSTALLATIONS_QUEUE:eduaircontrol.sensor.ms-environment-monitoring}
app.messaging.installations-routing-key=${INSTALLATIONS_ROUTING_KEY:sensor.installation.*}

# --- Topología de aulas ---
# Exchange, cola y binding los declara esta aplicación al arrancar (ver
# ClassroomMessagingConfig). El productor es el outbox de ms-classroom-management.
app.messaging.classroom.exchange=${CLASSROOM_EVENTS_EXCHANGE:eduaircontrol.classroom}
app.messaging.classroom.queue=${CLASSROOM_EVENTS_QUEUE:eduaircontrol.classroom.ms-environment-monitoring}
app.messaging.classroom.routing-key=${CLASSROOM_EVENTS_ROUTING_KEY:classroom.educational_environment.*}

# --- Backfill historico ---
# Copia el historico que nunca paso por el broker (el seed de desarrollo inserta por
# SQL). Es acoplamiento temporal y con fecha de caducidad: en cuanto este copiado, la
# unica via es el broker.
# Con ADR-003 la lectura puede ser del mismo esquema distinto: por eso el origen
# apunta al esquema monitoring de la misma base, no a otro servidor.
app.backfill.enabled=${BACKFILL_ENABLED:false}
app.backfill.initial-run=${BACKFILL_INITIAL_RUN:false}
app.backfill.resync-window=${BACKFILL_RESYNC_WINDOW:24h}
app.backfill.resync-interval=${BACKFILL_RESYNC_INTERVAL:6h}
app.backfill.initial-days=${BACKFILL_INITIAL_DAYS:400}

# Debounce para análisis
app.analysis.debounce-ms=60000
app.analysis.enabled=true
