databaseChangeLog:
  - changeSet:
      id: 016-push-token
      author: eduaircontrol
      comment: >
        Tokens push (Expo) para notificar alertas en la app movil. Se guardan por
        institucion: al generarse una alerta se avisa a los dispositivos de la
        institucion del ambiente. El token es unico (mismo dispositivo, un registro).
      changes:
        - createTable:
            schemaName: environment_monitoring
            tableName: push_token
            columns:
              - column:
                  name: push_token_id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_push_token
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_push_token
              - column:
                  name: platform
                  type: VARCHAR(20)
              - column:
                  name: institution_id
                  type: UUID
              - column:
                  name: user_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: |
              CREATE INDEX ix_push_token_institution
                ON environment_monitoring.push_token (institution_id);
      rollback:
        - dropTable:
            schemaName: environment_monitoring
            tableName: push_token
