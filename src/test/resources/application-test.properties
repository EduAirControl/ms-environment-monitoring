spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Solo esquema propio: sin semillas de desarrollo.
spring.liquibase.contexts=

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# El broker no se levanta en los tests de contexto: los listeners no arrancan y la
# aplicacion puede cargar sin RabbitMQ. Los tests de consumidor lo activan
# explicitamente (ConsumerTestBase) contra el broker de Testcontainers.
app.messaging.listeners.auto-startup=false
# Sin broker en los tests de contexto: los listeners no arrancan (ver
# app.messaging.listeners.auto-startup mas abajo). ConsumerTestBase apunta al
# RabbitMQ de Testcontainers y los vuelve a activar.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=test
spring.rabbitmq.password=test
# Sin reintentos con espera en los tests: un fallo debe llegar a la DLQ de inmediato.
app.messaging.max-retries=1
app.messaging.initial-retry-interval-ms=100

# Validacion RS256 contra una clave publica generada por TestTokenMint al arrancar
# el test (target/test-keys/). Ninguna clave se versiona y no se necesita red.
security.jwks-uri=
security.rsa.public-key-path=target/test-keys/test-public.pem
