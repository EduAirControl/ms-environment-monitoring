# Spring Framework 7 pausa y reinicia los ApplicationContext cacheados al cambiar
# entre clases de test con configuraciones distintas. Al reiniciar,
# RabbitListenerEndpointRegistry.start() arranca todos los contenedores ignorando
# su flag autoStartup (solo lo respeta antes del ContextRefreshedEvent), asi que
# los @RabbitListener intentan conectar al broker aunque esten declarados con
# auto-startup=false y el contexto falla con ACCESS_REFUSED.
#
# Mantener los contextos vivos evita ese reinicio y hace la suite determinista.
# Ver RabbitListenerEndpointRegistry#startIfNecessary y DefaultContextCache.
spring.test.context.cache.pause=NEVER
